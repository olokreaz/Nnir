server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API-бэкенд (ПР3): проксируем /api на FastAPI. Фронт ходит на относительный
    # /api/... — один origin, без CORS; постеры и данные согласованы.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA-роутинг: все пути отдают index.html (Angular Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэш статики с хэшем в имени
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
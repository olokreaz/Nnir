<!-- Каркас приложения NNIR: шапка + контент + подвал -->

<header class="sticky top-0 z-40 backdrop-blur-xl bg-bg/80 border-b border-border">
  <div class="mx-auto px-4 sm:px-6">
    <div class="flex items-center gap-3 sm:gap-6 h-16">
      <a routerLink="/" class="hidden sm:block font-extrabold text-xl tracking-tight shrink-0">
        <span class="text-neon-rose">N</span>NIR
      </a>

      <div class="flex-1 min-w-0">
        <div class="flex items-center w-full bg-surface border border-border rounded-full px-4 focus-within:border-neon-violet/60 transition">
          <svg class="w-4 h-4 text-mute shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
          <input type="search" placeholder="Фильмы, сериалы, аниме, жанры…"
                 class="flex-1 bg-transparent px-3 py-2.5 text-sm text-pastel placeholder:text-mute focus:outline-none" />
          <kbd class="hidden lg:inline text-[10px] text-mute border border-border rounded px-1.5 py-0.5">Ctrl K</kbd>
        </div>
      </div>

      <nav class="hidden lg:flex items-center gap-1 text-sm text-mute ml-auto">
        <a routerLink="/" routerLinkActive="text-pastel bg-surface" class="px-3 py-1.5 rounded-full hover:text-pastel hover:bg-surface">Главная</a>
        <a routerLink="/" fragment="classic" class="px-3 py-1.5 rounded-full hover:text-pastel hover:bg-surface">Классика</a>
        <a routerLink="/" fragment="rus" class="px-3 py-1.5 rounded-full hover:text-pastel hover:bg-surface">Российское</a>
        <a routerLink="/" fragment="anime" class="px-3 py-1.5 rounded-full hover:text-pastel hover:bg-surface">Аниме</a>
      </nav>

      <a href="#"
         class="shrink-0 hidden sm:inline-flex items-center justify-center px-4 py-2 rounded-full text-sm font-semibold bg-gradient-to-r from-neon-rose to-neon-violet text-white shadow-lg shadow-neon-rose/30 hover:opacity-90 transition">
        Войти
      </a>
    </div>
  </div>
</header>

<main class="min-h-[60vh]">
  <router-outlet />
</main>

<footer class="border-t border-border mt-10">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-10 grid grid-cols-2 md:grid-cols-4 gap-8 text-sm">
    <div>
      <div class="font-extrabold text-lg"><span class="text-neon-rose">N</span>NIR</div>
      <p class="mt-3 text-mute">Смотреть кино — красиво.</p>
    </div>
    <div>
      <div class="font-semibold mb-3">Разделы</div>
      <ul class="space-y-2 text-mute">
        <li><a routerLink="/" class="hover:text-pastel">Каталог</a></li>
        <li><a routerLink="/" fragment="anime" class="hover:text-pastel">Аниме</a></li>
        <li><a routerLink="/" fragment="series" class="hover:text-pastel">Сериалы</a></li>
      </ul>
    </div>
    <div>
      <div class="font-semibold mb-3">Компания</div>
      <ul class="space-y-2 text-mute">
        <li><a href="#" class="hover:text-pastel">О нас</a></li>
        <li><a href="#" class="hover:text-pastel">Контакты</a></li>
      </ul>
    </div>
    <div>
      <div class="font-semibold mb-3">Помощь</div>
      <ul class="space-y-2 text-mute">
        <li><a href="#" class="hover:text-pastel">FAQ</a></li>
        <li><a href="#" class="hover:text-pastel">Поддержка</a></li>
      </ul>
    </div>
  </div>
  <div class="border-t border-border">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-5 flex flex-wrap justify-between gap-2 text-xs text-mute">
      <span>© 2026 NNIR. Все права защищены.</span>
    </div>
  </div>
</footer>
